name: deploy

# Todo push na main é publicado na VM (mesma VM do Mergi, atrás do Caddy compartilhado).
on:
  push:
    branches: [main]
  workflow_dispatch:

# Um deploy por vez; o que chegar depois espera o anterior terminar.
concurrency:
  group: deploy-main
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: FrontEnd/site-cjl
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: FrontEnd/site-cjl/package-lock.json

      # Erro de build para aqui, não no servidor.
      - run: npm ci
      - run: npm run build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      # Histórico completo: o repo bare do servidor não aceita push vindo de clone raso.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Chave de deploy
        env:
          CJL_DEPLOY_KEY: ${{ secrets.CJL_DEPLOY_KEY }}
          CJL_KNOWN_HOSTS: ${{ secrets.CJL_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$CJL_DEPLOY_KEY" > ~/.ssh/deploy
          printf '%s\n' "$CJL_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/deploy ~/.ssh/known_hosts

      - name: Publicar na VM
        env:
          DEPLOY_REMOTE: cjldeploy@${{ secrets.CJL_DEPLOY_HOST }}:cjl.git
          GIT_SSH_COMMAND: ssh -i ~/.ssh/deploy -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes
        run: |
          # O servidor reconstrói o container no hook do push e escreve o resultado na saída.
          git push --force "$DEPLOY_REMOTE" "HEAD:refs/heads/main" 2>&1 | tee push.log
          if grep -q "deploy falhou" push.log; then
            echo "::error::O servidor recebeu o push, mas o deploy falhou. Veja o log acima."
            exit 1
          fi
          if ! grep -Eq "deploy de main -> cjl-site OK|Everything up-to-date" push.log; then
            echo "::error::O servidor não confirmou o deploy."
            exit 1
          fi

      - name: Site respondendo
        if: vars.CJL_SITE_URL != ''
        env:
          SITE_URL: ${{ vars.CJL_SITE_URL }}
        run: |
          for attempt in 1 2 3 4 5 6; do
            code="$(curl -s -o /dev/null -m 15 -w '%{http_code}' "$SITE_URL/" || true)"
            [ "$code" = "200" ] && { echo "$SITE_URL respondeu 200"; exit 0; }
            echo "tentativa $attempt: HTTP $code"
            sleep 5
          done
          echo "::error::$SITE_URL não respondeu 200 depois do deploy."
          exit 1

      - name: Apagar chave
        if: always()
        run: rm -f ~/.ssh/deploy
