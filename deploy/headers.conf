# Cabeçalhos de segurança de toda resposta. No nginx, um add_header dentro de um location apaga os
# herdados do server; por isso este arquivo é incluído em cada location, e não só uma vez.

# O navegador só volta a este endereço por HTTPS.
add_header Strict-Transport-Security "max-age=31536000" always;
# O tipo do arquivo é o que o servidor diz, sem adivinhação.
add_header X-Content-Type-Options "nosniff" always;
# Nenhum outro site pode mostrar a CJL dentro de uma moldura (clickjacking).
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
# Script só do próprio site. O Font Awesome vem do cdnjs (index.html), por isso ele entra em estilo e fonte.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com; img-src 'self' data: https:; font-src 'self' data: https://cdnjs.cloudflare.com; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
