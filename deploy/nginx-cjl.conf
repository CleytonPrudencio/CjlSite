# Exemplo de configuração do Nginx para o site da CJL.
# Copie para /etc/nginx/sites-available/cjl e ajuste server_name.
server {
    listen 80;
    server_name exemplo.com.br www.exemplo.com.br;

    root /var/www/cjl;
    index index.html;

    # O Vue Router usa createWebHistory: rotas desconhecidas caem no index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Arquivos com hash no nome podem ficar em cache por bastante tempo
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
