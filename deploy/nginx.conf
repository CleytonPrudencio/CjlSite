# O Caddy da VM (TLS) entrega para este nginx, que só serve os arquivos do build.

server_tokens off;

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  include /etc/nginx/snippets/cjl-headers.conf;

  client_max_body_size 16k;

  # Arquivos que começam com ponto (.env, .git) nunca são servidos, existam ou não.
  location ~ /\. {
    return 404;
  }

  # Arquivos do build têm hash no nome: podem ficar em cache para sempre.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    include /etc/nginx/snippets/cjl-headers.conf;
    try_files $uri =404;
  }

  # SPA: o Vue Router usa createWebHistory, então qualquer rota cai no index.html, que nunca fica em cache.
  location / {
    add_header Cache-Control "no-cache";
    include /etc/nginx/snippets/cjl-headers.conf;
    try_files $uri $uri/ /index.html;
  }
}
